spring:
  application:
    name: spotit-backend
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html

spotit:
  crypto:
    aes-key: ${CRYPTO_AES_KEY:h+5YDmnQ8RfYjADYUaaWcP7pjWnMCkoauzAdd7ZnyTE=}

logging:
  level:
    com.spotit.api: INFO
    org.hibernate.SQL: WARN
