spring:
  application:
    name: spotit-backend
  profiles:
    active: dev

  datasource:
    hikari:
      connection-timeout: 5000
      keepalive-time: 300000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html

# SMTP relay for all transactional mail (SmtpProperties). The only source of these values: each environment
# supplies them as env vars (entered in the Render dashboard on a new deployment); nothing is stored in the DB.
# Mail is disabled — sends fail with "SMTP is not configured" — until username, password and from-address are set.
spotit:
  smtp:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from-address: ${SMTP_FROM_ADDRESS:}
    use-tls: ${SMTP_USE_TLS:true}

logging:
  level:
    com.spotit.api: INFO
    org.hibernate.SQL: WARN
