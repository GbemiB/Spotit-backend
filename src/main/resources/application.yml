spring:
  application:
    name: spotit-backend
  profiles:
    active: dev

  datasource:
    hikari:
      connection-timeout: 5000
      keepalive-time: 300000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html

spotit:
  smtp:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from-address: ${SMTP_FROM_ADDRESS:}
    use-tls: ${SMTP_USE_TLS:true}
  # Comma-separated emails allowed to call /api/v1/config/**; empty = nobody
  admin:
    emails: ${ADMIN_EMAILS:}
  push:
    base-url: ${EXPO_PUSH_BASE_URL:https://exp.host/--/api/v2/push}
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    cron: ${REMINDERS_CRON:0 */15 * * * *}
    morning-time: ${REMINDER_MORNING_TIME:06:00}
    evening-time: ${REMINDER_EVENING_TIME:20:00}
    digest-time: ${REMINDER_DIGEST_TIME:19:00}
    digest-day: ${REMINDER_DIGEST_DAY:SUNDAY}
    period-days-before: ${REMINDER_PERIOD_DAYS_BEFORE:2,1,0}
    max-days-before: ${REMINDER_MAX_DAYS_BEFORE:2}
    catch-up-minutes: ${REMINDER_CATCH_UP_MINUTES:120}

logging:
  level:
    com.spotit.api: INFO
    org.hibernate.SQL: WARN
