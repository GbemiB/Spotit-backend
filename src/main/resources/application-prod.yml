spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?currentSchema=public&sslmode=${DB_SSLMODE:require}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
  jpa:
    show-sql: false

spotit:
  crypto:
    aes-key: ${CRYPTO_AES_KEY}

logging:
  level:
    com.spotit.api: INFO
