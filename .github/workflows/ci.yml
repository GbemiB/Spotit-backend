name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must be a genuine JDK 21 — Lombok's annotation processor silently no-ops when the
      # compiler cross-targets an older release, so getters/setters/builders vanish and every
      # entity fails to compile (see README "Requirements").
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` is the full gate: compile, every unit test, checkstyle (0 violations allowed) and the
      # JaCoCo rule that each controller/service keeps >= 80% line coverage. Render waits for this
      # job to pass before auto-deploying dev or main (autoDeployTrigger: checksPass in render.yaml).
      - name: Build, test, checkstyle and coverage
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
